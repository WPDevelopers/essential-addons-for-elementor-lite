	<rect x="298" y="90" width="44" height="4" rx="2" fill="#a99ed6"/>
	<rect x="298" y="100" width="34" height="4" rx="2" fill="#a99ed6"/>
	<rect x="298" y="110" width="40" height="4" rx="2" fill="#a99ed6"/>

