<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-label="Brand footer preview: a coloured footer with rounded top corners holding a two tone wordmark, a line of copy and social links beside three link columns, over a centred copyright line">
