	<rect x="212" y="70" width="28" height="4" rx="2" fill="#a99ed6"/>
	<rect x="212" y="80" width="36" height="4" rx="2" fill="#a99ed6"/>
	<rect x="212" y="90" width="30" height="4" rx="2" fill="#a99ed6"/>
	<rect x="212" y="100" width="38" height="4" rx="2" fill="#a99ed6"/>

	<rect x="298" y="56" width="32" height="6" rx="2" fill="#ffffff"/>
	<rect x="298" y="70" width="40" height="4" rx="2" fill="#a99ed6"/>
