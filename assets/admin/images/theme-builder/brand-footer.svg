	<rect x="24" y="76" width="118" height="4" rx="2" fill="#a99ed6"/>
	<rect x="24" y="85" width="96" height="4" rx="2" fill="#a99ed6"/>
	<circle cx="31" cy="105" r="8" fill="#ffffff"/>
	<circle cx="51" cy="105" r="8" fill="#ffffff"/>
	<circle cx="71" cy="105" r="8" fill="#ffffff"/>
	<circle cx="91" cy="105" r="8" fill="#ffffff"/>

	<!-- Link columns, deliberately uneven -->
