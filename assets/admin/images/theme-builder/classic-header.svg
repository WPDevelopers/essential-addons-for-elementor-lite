<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-label="Classic header preview: a dark bar with the brand on the left, navigation centred and one call to action on the right, over the page body">
	<rect width="480" height="150" fill="#f4f4f8"/>

	<!-- The bar -->
	<rect x="0" y="0" width="480" height="46" fill="#173b32"/>

	<!-- Brand -->
	<rect x="24" y="18" width="52" height="10" rx="3" fill="#ffffff"/>

	<!-- Navigation, centred on the bar -->
	<rect x="164" y="21" width="26" height="4" rx="2" fill="#dcece4"/>
	<rect x="200" y="21" width="32" height="4" rx="2" fill="#dcece4"/>
	<rect x="242" y="21" width="30" height="4" rx="2" fill="#dcece4"/>
	<rect x="282" y="21" width="24" height="4" rx="2" fill="#dcece4"/>

	<!-- Call to action -->
	<rect x="382" y="13" width="74" height="21" rx="3" fill="#2a4a41" stroke="#5f7d73"/>
	<rect x="399" y="21" width="40" height="4" rx="2" fill="#ffffff"/>

	<!-- Page body placeholder -->
	<rect x="24" y="66" width="432" height="10" rx="5" fill="#e6e6ef"/>
	<rect x="24" y="84" width="300" height="10" rx="5" fill="#ecedf3"/>
	<rect x="24" y="106" width="200" height="8" rx="4" fill="#f0f0f5"/>
</svg>
